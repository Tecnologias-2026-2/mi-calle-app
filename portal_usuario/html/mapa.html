<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Mapa de reportes</title>
    
    <!-- CSS global -->
    <link rel="stylesheet" href="../../css/styles.css">
    
    <!-- CSS de mi portal usuario-->
    <link rel="stylesheet" href="../usuario.css/usuario.css">

    <!-- Font Awesome (Librería de iconos) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

      <!-- Fuente Poppins-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 

</head>
<body>
    <!-- HEADER  --> 
 <header class="header-usuario">
    <a  href="index.html" class="logo">
         <!-- Aquí irá la imagen del logo. Por ahora un texto de prueba -->
        <div class="logo-icono">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="logo-texto">
            <h2>Mi Calle</h2>
            <span>Portal Ciudadano</span>
        </div>
    </a>

    
    <nav class="menu-navegacion" id="menu-navegacion">
        <a href="index.html" >Inicio</a>
        <a href="reportar.html">Reportar un problema</a>
        <a href="mis_reportes.html">Mis reportes</a>
        <a href="mapa.html" class="activo">Mapa de reportes</a>
    </nav>

    <div class="acciones-header">
        <a href="perfil.html" class="avatar-usuario">
            <i class="fa-solid fa-user"></i>
        </a>
        <button class="btn-hamburguesa" id="btn-menu" aria-label="Abrir menú" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
 </header>

<main class="dashboard-inicio">
    
    <!-- Contenedor del mapa -->
    <div class="contenedor-mapa">
        
        <!-- Cabecera del mapa con título y contador -->
        <div class="cabecera-mapa">
            <h1>Mapa de reportes</h1>
            <div class="contador-reportes">
                <i class="fa-solid fa-location-dot"></i> 10 reportes en tu zona
            </div>
        </div>

        <!-- Área del mapa (simulada con CSS) -->
        <div class="area-mapa">
            
            <!-- Pines de reportes (cada uno con su color de estado) -->
            <div
                class="pin pin-naranja"
                data-reporte="Semáforo averiado"
                data-ubicacion="Carrera 15 con Calle 82"
                data-fecha="12 de octubre de 2026"
                data-estado="En revisión"
                data-estado-clase="estado-amarillo"
                data-icono="fa-traffic-light"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de semáforo averiado"
                style="top: 25%; left: 75%;"
            ><i class="fa-solid fa-location-dot"></i></div>

            <div
                class="pin pin-verde"
                data-reporte="Alumbrado público reparado"
                data-ubicacion="Calle 63 con Carrera 24"
                data-fecha="8 de octubre de 2026"
                data-estado="Reparado"
                data-estado-clase="estado-verde"
                data-icono="fa-lightbulb"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de alumbrado público reparado"
                style="top: 55%; left: 30%;"
            ><i class="fa-solid fa-location-dot"></i></div>
            <div
                class="pin pin-verde"
                data-reporte="Señal de tránsito reparada"
                data-ubicacion="Avenida 7 con Calle 116"
                data-fecha="3 de octubre de 2026"
                data-estado="Reparado"
                data-estado-clase="estado-verde"
                data-icono="fa-signs-post"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de señal de tránsito reparada"
                style="top: 30%; left: 60%;"
            ><i class="fa-solid fa-location-dot"></i></div>

            <div
                class="pin pin-azul"
                data-reporte="Hueco en la vía"
                data-ubicacion="Carrera 9 con Calle 72"
                data-fecha="10 de octubre de 2026"
                data-estado="Reportado"
                data-estado-clase="estado-azul"
                data-icono="fa-road"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de hueco en la vía"
                style="top: 55%; left: 65%;"
            ><i class="fa-solid fa-location-dot"></i></div>
            <div
                class="pin pin-azul"
                data-reporte="Basura acumulada"
                data-ubicacion="Calle 45 con Carrera 13"
                data-fecha="9 de octubre de 2026"
                data-estado="Reportado"
                data-estado-clase="estado-azul"
                data-icono="fa-trash"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de basura acumulada"
                style="top: 60%; left: 55%;"
            ><i class="fa-solid fa-location-dot"></i></div>
            <div
                class="pin pin-azul"
                data-reporte="Andén deteriorado"
                data-ubicacion="Carrera 30 con Calle 26"
                data-fecha="6 de octubre de 2026"
                data-estado="Reportado"
                data-estado-clase="estado-azul"
                data-icono="fa-person-walking"
                role="button"
                tabindex="0"
                aria-label="Ver reporte de andén deteriorado"
                style="top: 75%; left: 60%;"
            ><i class="fa-solid fa-location-dot"></i></div>

        </div>

        <!-- Leyenda del mapa -->
        <div class="leyenda-mapa">
            <div class="item-leyenda"><span class="punto-leyenda punto-reportado"></span> Reportado</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-revision"></span> En revisión</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-reparado"></span> Reparado</div>
        </div>
    </div>

    <!-- Tarjeta de información del reporte (aparece al hacer clic en un pin) -->
    <div class="tarjeta-detalle-reporte" aria-live="polite">
        <div class="imagen-detalle">
            <i id="detalle-icono" class="fa-solid fa-road"></i>
        </div>
        <div class="info-detalle">
            <div class="fila-detalle">
                <span class="label-detalle">Reporte</span>
                <strong id="detalle-reporte">Hueco en la vía</strong>
            </div>
            <div class="fila-detalle">
                <span class="label-detalle">Ubicación</span>
                <strong id="detalle-ubicacion">Carrera 9 con Calle 72</strong>
            </div>
            <div class="fila-detalle">
                <span class="label-detalle">Fecha</span>
                <strong id="detalle-fecha">10 de octubre de 2026</strong>
            </div>
            <div class="fila-detalle">
                <span id="detalle-estado" class="estado estado-azul">Reportado</span>
            </div>
        </div>
    </div>

</main>

<script>
    const pines = document.querySelectorAll(".pin");
    const detalleIcono = document.querySelector("#detalle-icono");
    const detalleReporte = document.querySelector("#detalle-reporte");
    const detalleUbicacion = document.querySelector("#detalle-ubicacion");
    const detalleFecha = document.querySelector("#detalle-fecha");
    const detalleEstado = document.querySelector("#detalle-estado");

    function mostrarDetalle(pin) {
        detalleReporte.textContent = pin.dataset.reporte;
        detalleUbicacion.textContent = pin.dataset.ubicacion;
        detalleFecha.textContent = pin.dataset.fecha;
        detalleEstado.textContent = pin.dataset.estado;
        detalleEstado.className = `estado ${pin.dataset.estadoClase}`;
        detalleIcono.className = `fa-solid ${pin.dataset.icono}`;

        pines.forEach((elemento) => elemento.classList.remove("pin-seleccionado"));
        pin.classList.add("pin-seleccionado");
    }

    pines.forEach((pin) => {
        pin.addEventListener("click", () => mostrarDetalle(pin));
        pin.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                mostrarDetalle(pin);
            }
        });
    });
</script>
<script src="../menu.js"></script>
</body>
</html>
