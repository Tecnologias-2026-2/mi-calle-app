<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Mapa de reportes</title>
    
    <!-- CSS global -->
    <link rel="stylesheet" href="../../css/styles.css">
    
    <!-- CSS de mi portal usuario-->
    <link rel="stylesheet" href="../usuario.css/usuario.css">

    <!-- Font Awesome (Librería de iconos) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

      <!-- Fuente Poppins-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 

</head>
<body>
    <!-- HEADER  --> 
 <header class="header-usuario">
    <div class="logo">
         <!-- Aquí irá la imagen del logo. Por ahora un texto de prueba -->
        <div class="logo-icono">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="logo-texto">
            <h2>Mi Calle</h2>
            <span>Portal Ciudadano</span>
        </div>

    </div>

    
    <nav class="menu-navegacion">
        <a href="index.html" >Inicio</a>
        <a href="reportar.html">Reportar un problema</a>
        <a href="mis_reportes.html">Mis reportes</a>
        <a href="mapa.html" class="activo">Mapa de reportes</a>
    </nav>

    <div class="acciones-header">
        <a href="perfil.html" class="avatar-usuario">
            <i class="fa-solid fa-user"></i>
        </a>
    </div>
 </header>

<main class="dashboard-inicio">
    
    <!-- Contenedor del mapa -->
    <div class="contenedor-mapa">
        
        <!-- Cabecera del mapa con título y contador -->
        <div class="cabecera-mapa">
            <h1>Mapa de reportes</h1>
            <div class="contador-reportes">
                <i class="fa-solid fa-location-dot"></i> 10 reportes en tu zona
            </div>
        </div>

        <!-- Área del mapa (simulada con CSS) -->
        <div class="area-mapa">
            
            <!-- Pines de reportes (cada uno con su color de estado) -->
            <div class="pin pin-naranja" style="top: 25%; left: 75%;"><i class="fa-solid fa-location-dot"></i></div>

            <div class="pin pin-verde" style="top: 55%; left: 30%;"><i class="fa-solid fa-location-dot"></i></div>
            <div class="pin pin-verde" style="top: 30%; left: 60%;"><i class="fa-solid fa-location-dot"></i></div>

            <div class="pin pin-azul" style="top: 55%; left: 65%;"><i class="fa-solid fa-location-dot"></i></div>
            <div class="pin pin-azul" style="top: 60%; left: 55%;"><i class="fa-solid fa-location-dot"></i></div>
            <div class="pin pin-azul" style="top: 75%; left: 60%;"><i class="fa-solid fa-location-dot"></i></div>

        </div>

        <!-- Leyenda del mapa -->
        <div class="leyenda-mapa">
            <div class="item-leyenda"><span class="punto-leyenda punto-reportado"></span> Reportado</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-revision"></span> En revisión</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-reparado"></span> Reparado</div>
        </div>
    </div>

    <!-- Tarjeta de información del reporte (aparece al hacer clic en un pin) -->
    <div class="tarjeta-detalle-reporte">
        <div class="imagen-detalle">
            <i class="fa-solid fa-camera"></i>
        </div>
        <div class="info-detalle">
            <div class="fila-detalle">
                <span class="label-detalle">Reporte</span>
                <strong>daño</strong>
            </div>
            <div class="fila-detalle">
                <span class="label-detalle">Ubicación</span>
                <strong>dato</strong>
            </div>
            <div class="fila-detalle">
                <span class="label-detalle">Fecha</span>
                <strong>dato</strong>
            </div>
            <div class="fila-detalle">
                <span class="estado estado-rojo">En reparación</span>
            </div>
        </div>
    </div>

</main>

</body>
</html>
