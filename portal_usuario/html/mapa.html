<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Mapa de reportes</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
    
    <!-- CSS global -->
    <link rel="stylesheet" href="../../css/styles.css">
    
    <!-- CSS de mi portal usuario-->
    <link rel="stylesheet" href="../usuario.css/usuario.css">

    <!-- Font Awesome (Librería de iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER  --> 
 <header class="header-usuario">
    <a  href="index.html" class="logo">
         <!-- Aquí irá la imagen del logo. Por ahora un texto de prueba -->
        <div class="logo-icono">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="logo-texto">
            <h2>Mi Calle</h2>
            <span>Portal Ciudadano</span>
        </div>
    </a>

    
    <nav class="menu-navegacion" id="menu-navegacion">
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar un problema</a>
        <a href="mis_reportes.html">Mis reportes</a>
        <a href="mapa.html" class="activo">Reportes públicos</a>
    </nav>

    <div class="acciones-header">
        <a href="perfil.html" class="avatar-usuario">
            <i class="fa-solid fa-user"></i>
        </a>
        <button class="btn-hamburguesa" id="btn-menu" aria-label="Abrir menú" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
 </header>

<main class="dashboard-inicio">
    
    <!-- Contenedor del mapa -->
    <div class="contenedor-mapa">
        
        <!-- Cabecera del mapa con título y contador -->
        <div class="cabecera-mapa">
            <h1>Mapa de reportes</h1>
            <div class="contador-reportes" aria-live="polite">
                <span class="loading-spinner" aria-hidden="true"></span> Cargando reportes...
            </div>
        </div>
        <div class="filtros-reportes-publicos" aria-label="Filtros de reportes">
            <label for="filtro-categoria">Categoría</label>
            <select id="filtro-categoria">
                <option value="">Todas</option>
            </select>
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="en_revision">En revisión</option>
                <option value="en_proceso">En proceso</option>
                <option value="reparado">Reparado</option>
            </select>
        </div>

        <!-- Mapa interactivo de reportes -->
        <div class="area-mapa" id="mapa" aria-busy="true"></div>

        <!-- Leyenda del mapa -->
        <div class="leyenda-mapa" aria-label="Estados de los reportes">
            <div class="item-leyenda"><span class="punto-leyenda punto-pendiente"></span> Pendiente</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-revision"></span> En revisión</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-proceso"></span> En proceso</div>
            <div class="item-leyenda"><span class="punto-leyenda punto-reparado"></span> Reparado</div>
        </div>

        <section class="lista-reportes-publicos tarjeta-blanco" aria-labelledby="reportes-publicos-titulo">
            <h2 id="reportes-publicos-titulo">Reportes de la comunidad</h2>
            <div id="lista-reportes-publicos" aria-live="polite" aria-busy="true">
                <span class="loading-spinner" aria-hidden="true"></span> Cargando reportes...
            </div>
        </section>
    </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="../../demo-service.js"></script>
<script src="../../frontend-services.js"></script>
<script src="../reporte-formatters.js"></script>
<script src="../mapa-iconos.js"></script>
<script src="../visualizacion.js"></script>
<script src="../menu.js"></script>
</body>
</html>
