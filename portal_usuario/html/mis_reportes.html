<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="../../login-registro/html/assets/brand-icon.png">
    <link rel="apple-touch-icon" href="../../login-registro/html/assets/brand-icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Mis reportes</title>
    
    <!-- CSS global -->
    <link rel="stylesheet" href="../../css/styles.css">
    
    <!-- CSS de mi portal usuario-->
    <link rel="stylesheet" href="../usuario.css/usuario.css">

    <!-- Font Awesome (Librería de iconos) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
 

</head>
<body>
    <!-- HEADER  --> 
 <header class="header-usuario">
    <a  href="index.html" class="logo">
        <div class="logo-icono">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="logo-texto">
            <h2>Mi Calle</h2>
            <span>Portal Ciudadano</span>
        </div>
    </a>

    
    <nav class="menu-navegacion" id="menu-navegacion">
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar un problema</a>
        <a href="mis_reportes.html" class="activo">Mis reportes</a>
        <a href="mapa.html">Mapa de reportes</a>
    </nav>

    <div class="acciones-header">
        <a href="perfil.html" class="avatar-usuario">
            <i class="fa-solid fa-user"></i>
        </a>
        <button class="btn-hamburguesa" id="btn-menu" aria-label="Abrir menú" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
 </header>

<main class="dashboard-inicio">
    
    <!-- Cabecera de la página -->
    <div class="cabecera-pagina">
        <div class="texto-cabecera">
            <h1>Mis reportes</h1>
            <p>Consulta el estado y seguimiento de los reportes que has realizado.</p>
        </div>
    </div>

    <!-- Fila de tarjetas de resumen (4 columnas) -->
    <div class="grid-resumen-reportes">
        <div class="tarjeta-resumen-inicio borde-gris">
            <span class="numero-inicio" data-report-count="total">0</span>
            <span class="etiqueta-inicio">Total reportes</span>
        </div>
        <div class="tarjeta-resumen-inicio borde-azul">
            <span class="numero-inicio azul" data-report-count="reportado">0</span>
            <span class="etiqueta-inicio">Reportados</span>
        </div>
        <div class="tarjeta-resumen-inicio borde-amarillo">
            <span class="numero-inicio amarillo" data-report-count="proceso">0</span>
            <span class="etiqueta-inicio">En reparación</span>
        </div>
        <div class="tarjeta-resumen-inicio borde-verde">
            <span class="numero-inicio verde" data-report-count="resuelto">0</span>
            <span class="etiqueta-inicio">Reparados</span>
        </div>
    </div>

    <!-- Tabla de Reportes -->
    <div class="tarjeta-blanco contenedor-tabla">
        <div class="tabla-responsive">
            <table class="tabla-reportes">
                <thead>
                    <tr>
                        <th>Tipo de reporte</th>
                        <th>Ubicación</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody data-reports-loading aria-busy="true">
                    <tr><td colspan="4" class="loading-cell"><span class="loading-spinner" aria-hidden="true"></span> Cargando tus reportes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="../../frontend-services.js"></script>
<script src="../reporte-formatters.js"></script>
<script src="../portal-auth.js"></script>
<script src="../mis-reportes.js"></script>
<script src="../menu.js"></script>
</body>
</html>
