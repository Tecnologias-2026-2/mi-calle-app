<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Editar perfil</title>
    
    <!-- CSS global -->
    <link rel="stylesheet" href="../../css/styles.css">
    
    <!-- CSS de mi portal usuario-->
    <link rel="stylesheet" href="../usuario.css/usuario.css">

    <!-- Font Awesome (Librería de iconos) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

      <!-- Fuente Poppins-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 

</head>
<body>
    <!-- HEADER  --> 
 <header class="header-usuario">
    <a  href="index.html" class="logo">
         <!-- Aquí irá la imagen del logo. Por ahora un texto de prueba -->
        <div class="logo-icono">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="logo-texto">
            <h2>Mi Calle</h2>
            <span>Portal Ciudadano</span>
        </div>
    </a>

    
    <nav class="menu-navegacion" id="menu-navegacion">
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar un problema</a>
        <a href="mis_reportes.html">Mis reportes</a>
        <a href="mapa.html">Mapa de reportes</a>
    </nav>

    <div class="acciones-header">
        <a href="perfil.html" class="avatar-usuario">
            <i class="fa-solid fa-user"></i>
        </a>
        <button class="btn-hamburguesa" id="btn-menu" aria-label="Abrir menú" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
 </header>

 <main class="dashboard-inicio">
    
    <!-- Layout de 2 columnas específico para editar perfil -->
    <div class="layout-editar-perfil">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Información Personal -->
        <div class="columna-formulario-perfil">
            <section class="tarjeta-blanco">
                <h3 class="subtitulo">Información personal</h3>
                
                <form id="formulario-editar-perfil" novalidate>
                    <div class="campo-formulario">
                        <label for="nombre-usuario">Nombre de usuario</label>
                        <div class="input-con-icono">
                            <i class="fa-regular fa-pen-to-square"></i>
                            <input id="nombre-usuario" name="nombre_completo" type="text"
                                data-user-name value="" placeholder="Escribe tu nombre de usuario"
                                maxlength="100" required>
                        </div>
                    </div>

                    <div class="campo-formulario">
                        <label for="correo-electronico">Correo electrónico</label>
                        <div class="input-con-icono">
                            <i class="fa-regular fa-envelope"></i>
                            <input id="correo-electronico" name="email" type="email" data-user-email
                                value="" placeholder="No registrado" readonly>
                        </div>
                    </div>

                    <div class="campo-formulario">
                        <label for="telefono">Número de contacto</label>
                        <div class="input-con-icono">
                            <i class="fa-solid fa-phone"></i>
                            <input id="telefono" name="telefono" type="tel" data-user-phone-input
                                value="" placeholder="No registrado" maxlength="20">
                        </div>
                    </div>

                    <p id="mensaje-editar-perfil" role="status" aria-live="polite"></p>
                </form>
            </section>
        </div>

        <!-- COLUMNA DERECHA: Tarjeta de Perfil y Botones -->
        <div class="columna-perfil-acciones">
            
            <!-- Tarjeta de Perfil (Azul) -->
            <div class="tarjeta-perfil tarjeta-perfil-edicion">
                <div class="perfil-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3>Usuario</h3>
                <div class="perfil-datos">
                    <p><i class="fa-regular fa-envelope"></i> <span data-user-email-text>No registrado</span></p>
                    <p><i class="fa-solid fa-user-tag"></i> <span data-user-role>No configurado</span></p>
                    <p data-user-verification><i class="fa-solid fa-circle-check"></i> Cuenta verificada</p>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="botones-perfil-edicion">
                <button type="submit" form="formulario-editar-perfil"
                    class="btn-perfil-primario btn-guardar-perfil">
                    <i class="fa-regular fa-floppy-disk"></i> Guardar cambios
                </button>
                <a href="perfil.html" class="btn-perfil-secundario btn-cancelar"> Cancelar</a>
            </div>

        </div>
    </div>
</main>
</body>
<script src="../portal-auth.js"></script>
<script src="../editar-perfil.js"></script>
<script src="../menu.js"></script>
</html>
